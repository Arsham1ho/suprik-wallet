[build]
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "18"

# SPA routing - redirect all requests to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://js.puter.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://assets.coingecko.com https://coin-images.coingecko.com https://raw.githubusercontent.com https://cryptologos.cc https://static.jup.ag https://arweave.net https://ipfs.nftstorage.link https://assets.parqet.com https://cdn.prod.website-files.com https://api.dicebear.com https://i.ibb.co https://www.cryptocompare.com; connect-src 'self' https://api.mainnet-beta.solana.com https://api.devnet.solana.com https://mainnet.helius-rpc.com https://devnet.helius-rpc.com https://rpc.ankr.com https://solana-mainnet.quiknode.pro https://solana-api.projectserum.com https://api.coingecko.com https://api.jup.ag https://token.jup.ag https://api.dexscreener.com https://api-v3.raydium.io https://frontend-api.pump.fun https://qagsgxsaxspomcysaesa.supabase.co wss://api.mainnet-beta.solana.com wss://mainnet.helius-rpc.com wss://rpc.ankr.com; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'"

# No cache for HTML and service worker
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Long cache for hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
