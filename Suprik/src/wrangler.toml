# Cloudflare Pages Configuration
name = "suprik-wallet"
compatibility_date = "2024-11-25"

# This config is for Cloudflare Pages, not Workers
# Do NOT use 'wrangler deploy' command for Pages
# Instead, connect via Cloudflare Dashboard

# Pages will automatically detect these settings:
pages_build_output_dir = "dist"

# Environment Variables (مقادیر واقعی را در Cloudflare Pages Dashboard تنظیم کنید)
[env.production.vars]
# این فقط placeholder است - مقادیر واقعی را در Cloudflare Pages dashboard اضافه کنید

# SPA routing
[[redirects]]
from = "/*"
to = "/index.html"
status = 200