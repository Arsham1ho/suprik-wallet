<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تست Alchemy API Key - Saturn Wallet</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s;
            margin-bottom: 20px;
        }
        
        .button:hover {
            transform: translateY(-2px);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: bold;
        }
        
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .result {
            margin-top: 20px;
        }
        
        .api-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            border-right: 5px solid #ddd;
        }
        
        .api-card.valid {
            background: #d4edda;
            border-right-color: #28a745;
        }
        
        .api-card.invalid {
            background: #f8d7da;
            border-right-color: #dc3545;
        }
        
        .api-card.not-configured {
            background: #fff3cd;
            border-right-color: #ffc107;
        }
        
        .api-name {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-icon {
            font-size: 24px;
        }
        
        .api-status {
            font-size: 14px;
            color: #666;
        }
        
        .api-error {
            font-size: 12px;
            color: #dc3545;
            margin-top: 10px;
            background: white;
            padding: 10px;
            border-radius: 5px;
        }
        
        .help-box {
            background: #e7f3ff;
            border-right: 4px solid #2196F3;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            line-height: 1.6;
        }
        
        .help-box strong {
            display: block;
            margin-bottom: 8px;
            color: #2196F3;
        }
        
        .help-box ol {
            margin-right: 20px;
        }
        
        .help-box li {
            margin-bottom: 5px;
        }
        
        code {
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        
        .timestamp {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 تست Alchemy API Key</h1>
        <p class="subtitle">وضعیت اتصال به شبکه Ethereum را بررسی کنید</p>
        
        <button class="button" id="testBtn" onclick="testAPI()">
            🔍 شروع تست
        </button>
        
        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            در حال اتصال به سرور...
        </div>
        
        <div id="result" class="result" style="display: none;"></div>
    </div>

    <script>
        async function testAPI() {
            const testBtn = document.getElementById('testBtn');
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            
            testBtn.disabled = true;
            loading.style.display = 'block';
            result.style.display = 'none';
            
            try {
                // Note: Replace with your actual project ID and anon key
                // Or get them from the app
                const projectId = window.location.hostname.split('.')[0] || 'your-project';
                
                const response = await fetch(
                    `https://${projectId}.supabase.co/functions/v1/make-server-e5bc10d1/test-api-keys`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer YOUR_ANON_KEY_HERE'
                        }
                    }
                );
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                displayResults(data);
                
            } catch (error) {
                displayError(error.message);
            } finally {
                testBtn.disabled = false;
                loading.style.display = 'none';
                result.style.display = 'block';
            }
        }
        
        function displayResults(data) {
            const result = document.getElementById('result');
            
            let html = '';
            
            // Helius (Solana)
            html += createAPICard(
                'Helius API',
                '(Solana Network)',
                data.helius.configured,
                data.helius.valid,
                data.helius.error
            );
            
            // Alchemy (Ethereum)
            html += createAPICard(
                'Alchemy API',
                '(Ethereum Network)',
                data.alchemy.configured,
                data.alchemy.valid,
                data.alchemy.error
            );
            
            // Help text
            if (data.alchemy.configured && !data.alchemy.valid) {
                html += `
                    <div class="help-box">
                        <strong>🔧 راه حل مشکل Alchemy:</strong>
                        <ol>
                            <li>به <a href="https://dashboard.alchemy.com" target="_blank">Alchemy Dashboard</a> بروید</li>
                            <li>App خود را باز کنید</li>
                            <li>به تب <strong>Networks</strong> بروید</li>
                            <li><strong>Ethereum Mainnet</strong> را فعال کنید (Enable)</li>
                            <li>API Key جدید بگیرید (فقط قسمت بعد از <code>/v2/</code>)</li>
                            <li>در Supabase: Settings → Edge Functions → Secrets</li>
                            <li>Secret قدیمی را Delete کنید و جدید بسازید</li>
                            <li>5 دقیقه صبر کنید و دوباره تست کنید</li>
                        </ol>
                    </div>
                `;
            }
            
            html += `<div class="timestamp">⏰ آخرین بررسی: ${new Date().toLocaleString('fa-IR')}</div>`;
            
            result.innerHTML = html;
        }
        
        function createAPICard(name, subtitle, configured, valid, error) {
            let statusClass = 'not-configured';
            let icon = '⚠️';
            let statusText = 'تنظیم نشده';
            
            if (configured) {
                if (valid) {
                    statusClass = 'valid';
                    icon = '✅';
                    statusText = 'معتبر و فعال';
                } else {
                    statusClass = 'invalid';
                    icon = '❌';
                    statusText = 'نامعتبر';
                }
            }
            
            let errorHTML = '';
            if (error) {
                errorHTML = `<div class="api-error"><strong>خطا:</strong> ${error}</div>`;
            }
            
            return `
                <div class="api-card ${statusClass}">
                    <div class="api-name">
                        <span class="status-icon">${icon}</span>
                        <div>
                            <div>${name}</div>
                            <small style="font-weight: normal; color: #666;">${subtitle}</small>
                        </div>
                    </div>
                    <div class="api-status">${statusText}</div>
                    ${errorHTML}
                </div>
            `;
        }
        
        function displayError(message) {
            const result = document.getElementById('result');
            result.innerHTML = `
                <div class="api-card invalid">
                    <div class="api-name">
                        <span class="status-icon">❌</span>
                        خطا د�� اتصال
                    </div>
                    <div class="api-error">${message}</div>
                </div>
                <div class="help-box">
                    <strong>💡 نکات عیب‌یابی:</strong>
                    <ul>
                        <li>مطمئن شوید که اپلیکیشن Saturn در حال اجرا است</li>
                        <li>مطمئن شوید که Edge Function در Supabase فعال است</li>
                        <li>لاگ‌های Edge Function را در Supabase بررسی کنید</li>
                    </ul>
                </div>
            `;
        }
        
        // Auto-test on page load (optional)
        // window.addEventListener('load', () => {
        //     setTimeout(testAPI, 500);
        // });
    </script>
</body>
</html>
