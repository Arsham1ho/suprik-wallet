<!DOCTYPE html>
<html>
<head>
    <title>Test Helius API - PUMP & PAI Tokens</title>
    <style>
        body {
            font-family: monospace;
            background: #1a1a1a;
            color: #00ff00;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 { color: #00ffff; }
        h2 { color: #ffff00; }
        button {
            background: #4CAF50;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover { background: #45a049; }
        .result {
            background: #2a2a2a;
            border: 1px solid #444;
            padding: 15px;
            margin: 10px 0;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success { border-left: 4px solid #00ff00; }
        .error { border-left: 4px solid #ff0000; color: #ff6666; }
        .warning { border-left: 4px solid #ffaa00; color: #ffaa00; }
        .info { border-left: 4px solid #00aaff; color: #00aaff; }
        .token-item {
            background: #333;
            padding: 10px;
            margin: 5px 0;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🔍 Helius API Test - PUMP & PAI Token Detection</h1>
    
    <h2>📋 Your Wallet Info</h2>
    <div class="result info">
Address: 4VPthLUVvHe1vhojMkiG2A5cL8uWnfP1MazDV5VgSzQ3
Expected Tokens:
  - 12 PUMP (sent Nov 17, 2025 at 10:11 am)
  - 5 PAI (sent Nov 17, 2025 at 9:39 am)
    </div>

    <h2>🧪 Tests</h2>
    <button onclick="testDirectHelius()">1️⃣ Test Direct Helius RPC</button>
    <button onclick="testServerEndpoint()">2️⃣ Test Saturn Server Endpoint</button>
    <button onclick="testTokenMetadata()">3️⃣ Test Token Metadata (If we find tokens)</button>
    <button onclick="clearResults()">🗑️ Clear Results</button>

    <div id="results"></div>

    <script>
        const ADDRESS = "4VPthLUVvHe1vhojMkiG2A5cL8uWnfP1MazDV5VgSzQ3";
        const HELIUS_API_KEY = "e7ec6503-c9b2-4c0b-ae5f-3646622d4896";
        const HELIUS_URL = `https://mainnet.helius-rpc.com/?api-key=${HELIUS_API_KEY}`;
        
        let foundTokens = [];

        function addResult(html, className = '') {
            const div = document.createElement('div');
            div.className = `result ${className}`;
            div.innerHTML = html;
            document.getElementById('results').appendChild(div);
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        async function testDirectHelius() {
            addResult('<h3>🔍 Test 1: Direct Helius RPC Call</h3>', 'info');
            addResult('Calling getTokenAccountsByOwner...', 'info');

            try {
                const response = await fetch(HELIUS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        jsonrpc: '2.0',
                        id: 1,
                        method: 'getTokenAccountsByOwner',
                        params: [
                            ADDRESS,
                            { programId: 'TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA' },
                            { encoding: 'jsonParsed' }
                        ]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    addResult(`❌ RPC Error: ${JSON.stringify(data.error, null, 2)}`, 'error');
                    return;
                }

                const tokenAccounts = data.result?.value || [];
                foundTokens = tokenAccounts;

                addResult(`✅ Response Status: ${response.status}`, 'success');
                addResult(`📊 Total Token Accounts Found: ${tokenAccounts.length}`, tokenAccounts.length > 0 ? 'success' : 'warning');

                if (tokenAccounts.length === 0) {
                    addResult('⚠️ No token accounts found! This means:', 'warning');
                    addResult(`
Possible reasons:
1. Tokens haven't been confirmed on-chain yet
2. Wrong address (check if this matches your wallet)
3. Tokens were sent to a different address
4. RPC endpoint issue

Next steps:
- Check https://explorer.solana.com/address/${ADDRESS}
- Verify the transaction hash from Orb wallet
- Make sure you're checking the correct wallet address
                    `, 'warning');
                } else {
                    let tokensHTML = '<h4>📋 Found Token Accounts:</h4>';
                    
                    tokenAccounts.forEach((acc, i) => {
                        const info = acc.account.data.parsed.info;
                        const amount = info.tokenAmount.uiAmount;
                        const decimals = info.tokenAmount.decimals;
                        
                        tokensHTML += `
<div class="token-item">
  <strong>Token #${i + 1}</strong>
  Mint: ${info.mint}
  Amount: ${amount} (decimals: ${decimals})
  ${amount > 0 ? '✅ HAS BALANCE' : '⚠️ ZERO BALANCE'}
</div>`;
                    });
                    
                    addResult(tokensHTML, 'success');

                    // Check for PUMP and PAI
                    const hasPUMP = tokenAccounts.some(acc => {
                        const amount = acc.account.data.parsed.info.tokenAmount.uiAmount;
                        return amount > 0; // We'll identify by metadata later
                    });

                    if (tokenAccounts.some(acc => acc.account.data.parsed.info.tokenAmount.uiAmount > 0)) {
                        addResult('✅ Found tokens with balance! Click "Test Token Metadata" to see names', 'success');
                    }
                }

                addResult(`<details><summary>📄 Full Raw Response (click to expand)</summary><pre>${JSON.stringify(data, null, 2)}</pre></details>`, 'info');

            } catch (error) {
                addResult(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        async function testServerEndpoint() {
            addResult('<h3>🔍 Test 2: Saturn Server Endpoint</h3>', 'info');
            addResult('Calling /solana-balance endpoint...', 'info');

            try {
                // You'll need to update these values from your Supabase project
                const projectId = window.location.hostname.includes('.supabase.co') 
                    ? window.location.hostname.split('.')[0]
                    : 'YOUR_PROJECT_ID'; // Replace with your actual project ID
                    
                const publicAnonKey = 'YOUR_ANON_KEY'; // Replace with your actual anon key

                addResult(`⚠️ Note: You need to update projectId and publicAnonKey in the test file`, 'warning');
                
                const response = await fetch(
                    `https://${projectId}.supabase.co/functions/v1/make-server-e5bc10d1/solana-balance`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${publicAnonKey}`
                        },
                        body: JSON.stringify({ 
                            address: ADDRESS, 
                            networkMode: 'mainnet' 
                        })
                    }
                );

                const data = await response.json();

                addResult(`✅ Response Status: ${response.status}`, response.ok ? 'success' : 'error');
                addResult(`📊 SOL Balance: ${data.native || 0} SOL`, 'info');
                addResult(`📊 SPL Tokens: ${(data.tokens || []).length}`, (data.tokens || []).length > 0 ? 'success' : 'warning');

                if (data.tokens && data.tokens.length > 0) {
                    let tokensHTML = '<h4>📋 Tokens from Server:</h4>';
                    
                    data.tokens.forEach((token, i) => {
                        tokensHTML += `
<div class="token-item">
  <strong>${token.symbol}</strong> - ${token.name}
  Amount: ${token.amount}
  Mint: ${token.mint}
  ${token.logoUrl ? '🖼️ Has Logo' : '⚠️ No Logo'}
</div>`;
                    });
                    
                    addResult(tokensHTML, 'success');

                    // Check for PUMP and PAI
                    const pumpToken = data.tokens.find(t => t.symbol === 'PUMP');
                    const paiToken = data.tokens.find(t => t.symbol === 'PAI');

                    if (pumpToken) {
                        addResult(`✅ PUMP token found! Amount: ${pumpToken.amount}`, 'success');
                    } else {
                        addResult(`❌ PUMP token NOT found in server response`, 'error');
                    }

                    if (paiToken) {
                        addResult(`✅ PAI token found! Amount: ${paiToken.amount}`, 'success');
                    } else {
                        addResult(`❌ PAI token NOT found in server response`, 'error');
                    }
                } else {
                    addResult('❌ Server returned 0 tokens - this is the bug!', 'error');
                }

                addResult(`<details><summary>📄 Full Server Response (click to expand)</summary><pre>${JSON.stringify(data, null, 2)}</pre></details>`, 'info');

            } catch (error) {
                addResult(`❌ Error: ${error.message}`, 'error');
                console.error(error);
            }
        }

        async function testTokenMetadata() {
            if (foundTokens.length === 0) {
                addResult('⚠️ Run Test 1 first to find tokens!', 'warning');
                return;
            }

            addResult('<h3>🔍 Test 3: Token Metadata (DAS API)</h3>', 'info');

            for (let i = 0; i < foundTokens.length; i++) {
                const account = foundTokens[i];
                const info = account.account.data.parsed.info;
                const mint = info.mint;
                const amount = info.tokenAmount.uiAmount;

                if (amount <= 0) {
                    addResult(`⏭️ Skipping ${mint.substring(0, 8)}... (zero balance)`, 'info');
                    continue;
                }

                addResult(`Fetching metadata for ${mint.substring(0, 8)}...`, 'info');

                try {
                    const response = await fetch(HELIUS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            jsonrpc: '2.0',
                            id: 1,
                            method: 'getAsset',
                            params: { id: mint }
                        })
                    });

                    const data = await response.json();

                    if (data.result) {
                        const name = data.result.content?.metadata?.name || 'Unknown';
                        const symbol = data.result.content?.metadata?.symbol || 'UNKNOWN';
                        const image = data.result.content?.links?.image || '';

                        addResult(`
<div class="token-item">
  <strong>${symbol}</strong> - ${name}
  Amount: ${amount}
  Mint: ${mint}
  ${image ? `🖼️ Logo: ${image.substring(0, 50)}...` : '⚠️ No logo'}
  
  ${symbol === 'PUMP' ? '🎉 THIS IS YOUR PUMP TOKEN!' : ''}
  ${symbol === 'PAI' ? '🎉 THIS IS YOUR PAI TOKEN!' : ''}
</div>
                        `, symbol === 'PUMP' || symbol === 'PAI' ? 'success' : 'info');
                    } else {
                        addResult(`⚠️ No metadata for ${mint.substring(0, 8)}...`, 'warning');
                    }
                } catch (error) {
                    addResult(`❌ Error fetching metadata for ${mint.substring(0, 8)}...: ${error.message}`, 'error');
                }
            }
        }
    </script>
</body>
</html>
